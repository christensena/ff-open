# Put in the [env] section of a folder's mise.toml (e.g. ~/Code/work/mise.toml).
# Applies to that folder and everything beneath it.
[env]
BROWSER = "{{env.HOME}}/.local/share/ff-open/bin/open"
_.path = ["{{env.HOME}}/.local/share/ff-open/bin"]
# Folder name under ~/Library/Application Support/Firefox/Profiles/
FIREFOX_PROFILE = "abcd1234.Profile 2"
